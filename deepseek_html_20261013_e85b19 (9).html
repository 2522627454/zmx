<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>合成氨可逆反应动态平衡模拟</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e27; color: #e0e0e0;
    font-family: 'Microsoft YaHei', sans-serif;
    overflow: hidden; height: 100vh;
    display: flex; flex-direction: column;
  }
  #header {
    padding: 10px 20px; background: rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; justify-content: space-between; align-items: center;
  }
  #header h1 { font-size: 18px; color: #5b9bd5; }
  #controls button {
    padding: 6px 16px; margin-left: 8px;
    background: #1a3a5c; color: #e0e0e0;
    border: 1px solid #5b9bd5; border-radius: 4px;
    cursor: pointer; font-size: 14px;
  }
  #controls button:hover { background: #2a5a8c; }
  #main { flex: 1; display: flex; padding: 10px; gap: 10px; min-height: 0; }
  #sim-container {
    flex: 3; position: relative; background: #0d1230;
    border-radius: 8px; overflow: hidden;
    border: 1px solid rgba(91,155,213,0.3);
  }
  #simCanvas { display: block; width: 100%; height: 100%; }
  #chart-container {
    flex: 2; display: flex; flex-direction: column; gap: 10px; min-height: 0;
  }
  .chart-box {
    flex: 1; background: #0d1230; border-radius: 8px;
    border: 1px solid rgba(91,155,213,0.3);
    position: relative; min-height: 0;
  }
  .chart-box canvas { display: block; width: 100%; height: 100%; }
  #status {
    padding: 8px 20px; background: rgba(255,255,255,0.03);
    border-top: 1px solid rgba(255,255,255,0.1);
    display: flex; gap: 24px; font-size: 14px; flex-wrap: wrap;
  }
  .status-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot-n2 { background: #5b9bd5; }
  .dot-h2 { background: #e8e8e8; }
  .dot-nh3 { background: #4caf50; }
  .dot-vf { background: #4caf50; }
  .dot-vr { background: #ff9800; }
  #balance-indicator {
    margin-left: auto; font-weight: bold; padding: 2px 12px;
    border-radius: 12px; background: rgba(255,152,0,0.2); color: #ff9800;
  }
  #balance-indicator.equilibrium {
    background: rgba(76,175,80,0.2); color: #4caf50;
  }
</style>
</head>
<body>
<div id="header">
  <h1>合成氨可逆反应 N₂ + 3H₂ ⇌ 2NH₃ 动态平衡模拟</h1>
  <div id="controls">
    <button id="startBtn">开始</button>
    <button id="pauseBtn">暂停</button>
    <button id="resetBtn">重置</button>
  </div>
</div>
<div id="main">
  <div id="sim-container"><canvas id="simCanvas"></canvas></div>
  <div id="chart-container">
    <div class="chart-box"><canvas id="vChart"></canvas></div>
    <div class="chart-box"><canvas id="cChart"></canvas></div>
  </div>
</div>
<div id="status">
  <div class="status-item"><span class="dot dot-n2"></span>N₂: <span id="countN2">0</span></div>
  <div class="status-item"><span class="dot dot-h2"></span>H₂: <span id="countH2">0</span></div>
  <div class="status-item"><span class="dot dot-nh3"></span>NH₃: <span id="countNH3">0</span></div>
  <div class="status-item"><span class="dot dot-vf"></span>v正: <span id="vForward">0</span></div>
  <div class="status-item"><span class="dot dot-vr"></span>v逆: <span id="vReverse">0</span></div>
  <div id="balance-indicator">正反应进行中</div>
</div>
<script>
const simCanvas = document.getElementById('simCanvas');
const simCtx = simCanvas.getContext('2d');
const vChart = document.getElementById('vChart');
const vCtx = vChart.getContext('2d');
const cChart = document.getElementById('cChart');
const cCtx = cChart.getContext('2d');
const catalystHeight = 50;

function resize() {
  const simDiv = document.getElementById('sim-container');
  simCanvas.width = simDiv.clientWidth;
  simCanvas.height = simDiv.clientHeight;
  const chartDivs = document.querySelectorAll('.chart-box');
  vChart.width = chartDivs[0].clientWidth;
  vChart.height = chartDivs[0].clientHeight;
  cChart.width = chartDivs[1].clientWidth;
  cChart.height = chartDivs[1].clientHeight;
}
window.addEventListener('resize', resize);

// ===== 分子 =====
class Molecule {
  constructor(type, x, y) {
    this.type = type;
    const w = simCanvas.width || 800;
    const h = simCanvas.height || 600;
    this.x = x !== undefined ? x : Math.random() * (w - 80) + 40;
    this.y = y !== undefined ? y : Math.random() * (h - catalystHeight - 100) + 40;
    const angle = Math.random() * Math.PI * 2;
    const speed = type === 'NH3' ? 1.8 : 2.3;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.fade = 1;
  }
  getRadius() {
    if (this.type === 'N2') return 18;
    if (this.type === 'H2') return 14;
    return 22;
  }
  nearCatalyst() {
    const floorY = simCanvas.height - catalystHeight;
    return this.y + this.getRadius() > floorY - 80;
  }
  update() {
    const speedMul = this.nearCatalyst() ? 0.5 : 1.0;
    this.x += this.vx * speedMul;
    this.y += this.vy * speedMul;
    const r = this.getRadius();
    const w = simCanvas.width, h = simCanvas.height;
    if (this.x - r < 0) { this.x = r; this.vx *= -1; }
    if (this.x + r > w) { this.x = w - r; this.vx *= -1; }
    if (this.y - r < 0) { this.y = r; this.vy *= -1; }
    const floorY = h - catalystHeight;
    if (this.y + r > floorY) { this.y = floorY - r; this.vy *= -1; }
    if (this.fade < 1) this.fade = Math.min(1, this.fade + 0.08);
  }
  draw(ctx) {
    ctx.globalAlpha = this.fade;
    if (this.type === 'N2') {
      ctx.fillStyle = '#5b9bd5';
      ctx.beginPath(); ctx.arc(this.x - 8, this.y, 9, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(this.x + 8, this.y, 9, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#3a7bc8'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(this.x - 8, this.y, 9, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(this.x + 8, this.y, 9, 0, Math.PI * 2); ctx.stroke();
    } else if (this.type === 'H2') {
      ctx.fillStyle = '#e8e8e8';
      ctx.beginPath(); ctx.arc(this.x - 6, this.y, 7, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(this.x + 6, this.y, 7, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#aaaaaa'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(this.x - 6, this.y, 7, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(this.x + 6, this.y, 7, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.fillStyle = '#5b9bd5';
      ctx.beginPath(); ctx.arc(this.x, this.y, 9, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#3a7bc8'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(this.x, this.y, 9, 0, Math.PI * 2); ctx.stroke();
      const dist = 14;
      for (let i = 0; i < 3; i++) {
        const ang = (i * 2 * Math.PI / 3) - Math.PI / 2;
        const hx = this.x + Math.cos(ang) * dist;
        const hy = this.y + Math.sin(ang) * dist;
        ctx.fillStyle = '#e8e8e8';
        ctx.beginPath(); ctx.arc(hx, hy, 7, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#aaaaaa'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(hx, hy, 7, 0, Math.PI * 2); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }
}

// ===== 状态 =====
let molecules = [];
let time = 0;
let running = false;
let vData = [], cData = [];
let flashGreen = 0, flashOrange = 0;

const INIT_N2 = 20;
const INIT_H2 = 60;
const kf = 0.0000063;
const kr = 0.0000504;
const SCALE = 5000;
const SPEED_FACTOR = 0.85;   // 控制约 30 秒达到平衡

// 连续反应进度：0 → 平衡值约 6.22
let progress = 0;

function countType(type) {
  let n = 0;
  for (const m of molecules) if (m.type === type) n++;
  return n;
}

function removeMol(m) {
  const idx = molecules.indexOf(m);
  if (idx >= 0) molecules.splice(idx, 1);
}

function addMolecule(type, x, y) {
  const m = new Molecule(type, x, y);
  m.fade = 0;
  molecules.push(m);
  return m;
}

function pickNear(type, n) {
  const all = molecules.filter(m => m.type === type);
  if (all.length < n) return null;
  all.sort((a, b) => b.y - a.y);
  const poolSize = Math.max(n, Math.floor(all.length / 2));
  const pool = all.slice(0, poolSize);
  const picked = [];
  for (let i = 0; i < n; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    picked.push(pool[idx]);
    pool.splice(idx, 1);
  }
  return picked;
}

function doPositive() {
  const n2s = pickNear('N2', 1);
  const h2s = pickNear('H2', 3);
  if (!n2s || !h2s) return false;
  const px = n2s[0].x;
  const floorY = simCanvas.height - catalystHeight;
  for (const m of n2s) removeMol(m);
  for (const m of h2s) removeMol(m);
  for (let i = 0; i < 2; i++) {
    addMolecule('NH3',
      px + (Math.random() - 0.5) * 60,
      floorY - 40 - Math.random() * 20);
  }
  flashGreen = 20;
  return true;
}

function doReverse() {
  const nh3s = pickNear('NH3', 2);
  if (!nh3s) return false;
  const px = (nh3s[0].x + nh3s[1].x) / 2;
  const floorY = simCanvas.height - catalystHeight;
  for (const m of nh3s) removeMol(m);
  addMolecule('N2', px, floorY - 40 - Math.random() * 20);
  for (let i = 0; i < 3; i++) {
    addMolecule('H2',
      px + (Math.random() - 0.5) * 60,
      floorY - 40 - Math.random() * 20);
  }
  flashOrange = 20;
  return true;
}

function reset() {
  molecules = [];
  time = 0;
  progress = 0;
  vData = [];
  cData = [];
  flashGreen = 0; flashOrange = 0;
  const w = simCanvas.width, h = simCanvas.height;
  const floorY = h - catalystHeight;
  for (let i = 0; i < INIT_N2; i++) {
    const m = new Molecule('N2');
    m.y = Math.random() * (floorY - 80) + 30;
    m.x = Math.random() * (w - 80) + 40;
    molecules.push(m);
  }
  for (let i = 0; i < INIT_H2; i++) {
    const m = new Molecule('H2');
    m.y = Math.random() * (floorY - 80) + 30;
    m.x = Math.random() * (w - 80) + 40;
    molecules.push(m);
  }
  recordData();
}

// 图表数据完全基于连续理论模型，永远平滑
function recordData() {
  const nN2 = Math.max(0, INIT_N2 - progress);
  const nH2 = Math.max(0, INIT_H2 - 3 * progress);
  const nNH3 = Math.max(0, 2 * progress);
  const vf = kf * nN2 * nH2 * SCALE;
  const vr = kr * nNH3 * Math.max(0, nNH3 - 1) / 2 * SCALE;
  vData.push({ t: time, vf, vr });
  cData.push({ t: time, cN2: nN2, cH2: nH2, cNH3: nNH3 });
}

function update() {
  if (!running) return;
  time++;

  // ==== 1. 连续理论模型推进 progress ====
  const nN2_th = Math.max(0, INIT_N2 - progress);
  const nH2_th = Math.max(0, INIT_H2 - 3 * progress);
  const nNH3_th = Math.max(0, 2 * progress);

  const vf_th = kf * nN2_th * nH2_th;
  const vr_th = kr * nNH3_th * Math.max(0, nNH3_th - 1) / 2;

  progress += (vf_th - vr_th) * SPEED_FACTOR;
  if (progress < 0) progress = 0;
  if (progress > INIT_N2) progress = INIT_N2;

  // ==== 2. 分子层：随机事件 + 偏差校正 ====
  const targetN2 = Math.round(nN2_th);
  const targetH2 = Math.round(nH2_th);
  const targetNH3 = Math.round(nNH3_th);

  const nN2 = countType('N2'), nH2 = countType('H2'), nNH3 = countType('NH3');
  const devN2 = nN2 - targetN2;

  let pF = vf_th * (1 + Math.max(0, devN2) * 3);
  let pR = vr_th * (1 + Math.max(0, -devN2) * 3);
  pF = Math.min(0.3, pF);
  pR = Math.min(0.3, pR);

  if (Math.random() < pF) doPositive();
  if (Math.random() < pR) doReverse();

  // ==== 3. 分子运动 ====
  for (const m of molecules) m.update();

  // ==== 4. 记录图表（理论值）====
  if (time % 2 === 0) recordData();

  // ==== 5. 状态栏 ====
  const cN2 = countType('N2'), cH2 = countType('H2'), cNH3 = countType('NH3');
  document.getElementById('countN2').textContent = cN2;
  document.getElementById('countH2').textContent = cH2;
  document.getElementById('countNH3').textContent = cNH3;
  document.getElementById('vForward').textContent = (vf_th * SCALE).toFixed(1);
  document.getElementById('vReverse').textContent = (vr_th * SCALE).toFixed(1);

  const ratio = vf_th / (vr_th + 1e-9);
  const ind = document.getElementById('balance-indicator');
  const isEquilibrium = ratio > 0.9 && ratio < 1.1 && nNH3_th > 5;
  if (isEquilibrium) {
    ind.textContent = '动态平衡  v正=v逆≠0';
    ind.className = 'equilibrium';
  } else if (vf_th > vr_th) {
    ind.textContent = '正反应占优';
    ind.className = '';
  } else {
    ind.textContent = '逆反应占优';
    ind.className = '';
  }

  if (flashGreen > 0) flashGreen--;
  if (flashOrange > 0) flashOrange--;
}

// ===== 绘制 =====
function drawSim() {
  const w = simCanvas.width, h = simCanvas.height;
  simCtx.clearRect(0, 0, w, h);

  const grad = simCtx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#0a0e27');
  grad.addColorStop(1, '#0d1230');
  simCtx.fillStyle = grad;
  simCtx.fillRect(0, 0, w, h);

  const floorY = h - catalystHeight;
  const catGrad = simCtx.createLinearGradient(0, floorY, 0, h);
  catGrad.addColorStop(0, '#4a4a4a');
  catGrad.addColorStop(1, '#2a2a2a');
  simCtx.fillStyle = catGrad;
  simCtx.fillRect(0, floorY, w, catalystHeight);
  simCtx.strokeStyle = '#6a6a6a';
  simCtx.lineWidth = 1;
  for (let x = 0; x < w; x += 20) {
    simCtx.beginPath();
    simCtx.moveTo(x, floorY + 5);
    simCtx.lineTo(x + 10, floorY + 5);
    simCtx.stroke();
  }
  simCtx.fillStyle = 'rgba(91,155,213,0.08)';
  simCtx.fillRect(0, floorY - 80, w, 80);

  if (flashGreen > 0) {
    const alpha = flashGreen / 20 * 0.35;
    simCtx.fillStyle = `rgba(76,175,80,${alpha})`;
    simCtx.fillRect(0, floorY - 80, w / 2, 80);
  }
  if (flashOrange > 0) {
    const alpha = flashOrange / 20 * 0.35;
    simCtx.fillStyle = `rgba(255,152,0,${alpha})`;
    simCtx.fillRect(w / 2, floorY - 80, w / 2, 80);
  }

  for (const m of molecules) m.draw(simCtx);

  simCtx.font = 'bold 13px Microsoft YaHei';
  simCtx.fillStyle = 'rgba(76,175,80,0.8)';
  simCtx.fillText('正反应 N₂+3H₂→2NH₃', 15, 25);
  simCtx.fillStyle = 'rgba(255,152,0,0.8)';
  simCtx.fillText('逆反应 2NH₃→N₂+3H₂', w - 200, 25);

  simCtx.fillStyle = 'rgba(255,255,255,0.5)';
  simCtx.font = '12px Microsoft YaHei';
  simCtx.fillText('灰色为铁催化剂表面（浅蓝区为吸附区）', 15, h - 12);
}

function drawChart(ctx, canvas, data, type) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const pad = { left: 50, right: 20, top: 30, bottom: 30 };
  const w = canvas.width - pad.left - pad.right;
  const h = canvas.height - pad.top - pad.bottom;

  ctx.fillStyle = '#0d1230';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#5b9bd5';
  ctx.font = 'bold 13px Microsoft YaHei';
  ctx.fillText(type === 'v' ? '速率-时间图 (v-t)' : '浓度-时间图 (c-t)', pad.left, 20);

  if (data.length < 2) return;

  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad.left, pad.top);
  ctx.lineTo(pad.left, pad.top + h);
  ctx.lineTo(pad.left + w, pad.top + h);
  ctx.stroke();

  let maxY = type === 'v' ? 50 : INIT_H2;

  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 5; i++) {
    const y = pad.top + h - (i / 5) * h;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(pad.left + w, y);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '10px Microsoft YaHei';
    ctx.fillText((maxY * i / 5).toFixed(0), 10, y + 3);
  }

  const tMax = data[data.length - 1].t;
  const tMin = data[0].t;
  const tRange = Math.max(1, tMax - tMin);

  function plot(key, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < data.length; i++) {
      const x = pad.left + ((data[i].t - tMin) / tRange) * w;
      const val = data[i][key];
      const y = pad.top + h - (val / maxY) * h;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  if (type === 'v') {
    plot('vf', '#4caf50');
    plot('vr', '#ff9800');
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(pad.left + w - 140, pad.top + 5, 12, 3);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '11px Microsoft YaHei';
    ctx.fillText('v正', pad.left + w - 125, pad.top + 10);
    ctx.fillStyle = '#ff9800';
    ctx.fillRect(pad.left + w - 80, pad.top + 5, 12, 3);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('v逆', pad.left + w - 65, pad.top + 10);
  } else {
    plot('cN2', '#5b9bd5');
    plot('cH2', '#e8e8e8');
    plot('cNH3', '#4caf50');
    ctx.font = '11px Microsoft YaHei';
    ctx.fillStyle = '#5b9bd5';
    ctx.fillRect(pad.left + w - 190, pad.top + 5, 12, 3);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('N₂', pad.left + w - 175, pad.top + 10);
    ctx.fillStyle = '#e8e8e8';
    ctx.fillRect(pad.left + w - 135, pad.top + 5, 12, 3);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('H₂', pad.left + w - 120, pad.top + 10);
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(pad.left + w - 80, pad.top + 5, 12, 3);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('NH₃', pad.left + w - 65, pad.top + 10);
  }

  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '10px Microsoft YaHei';
  ctx.fillText('时间', pad.left + w / 2 - 15, pad.top + h + 20);
}

function drawCharts() {
  drawChart(vCtx, vChart, vData, 'v');
  drawChart(cCtx, cChart, cData, 'c');
}

function loop() {
  update();
  drawSim();
  drawCharts();
  requestAnimationFrame(loop);
}

document.getElementById('startBtn').onclick = () => { running = true; };
document.getElementById('pauseBtn').onclick = () => { running = false; };
document.getElementById('resetBtn').onclick = () => {
  running = false;
  resize();
  reset();
  drawSim();
  drawCharts();
};

resize();
reset();
drawSim();
drawCharts();
loop();
</script>
</body>
</html>
